services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: videonova
      POSTGRES_USER: videonova
      POSTGRES_PASSWORD: videonova
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videonova -d videonova"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://videonova:videonova@postgres:5432/videonova?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://videonova:videonova@postgres:5432/videonova?schema=public
      REDIS_HOST: redis
      STORAGE_ROOT: /app/storage
      FFMPEG_PATH: /usr/bin/ffmpeg
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/storage
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://videonova:videonova@postgres:5432/videonova?schema=public
      REDIS_HOST: redis
      STORAGE_ROOT: /app/storage
      FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
